deptrac:
  paths:
    - ./app/Modules
  layers:
    - name: Auth
      collectors:
        - { type: classLike, value: ^App\\Modules\\Auth\\.* }
    - name: Accounts
      collectors:
        - { type: classLike, value: ^App\\Modules\\Accounts\\.* }
    - name: Balances
      collectors:
        - { type: classLike, value: ^App\\Modules\\Balances\\.* }
  ruleset:
    Auth: []
    Accounts: [Auth]
    Balances: [Accounts]