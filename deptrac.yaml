deptrac:
  paths:
    - ./app/Modules
  layers:
    - name: Auth
      collectors:
        - { type: classLike, value: ^App\\Modules\\Auth\\.* }
    - name: Users
      collectors:
        - { type: classLike, value: ^App\\Modules\\Users\\.* }    
    - name: Accounts
      collectors:
        - { type: classLike, value: ^App\\Modules\\Accounts\\.* }
    - name: Balances
      collectors:
        - { type: classLike, value: ^App\\Modules\\Balances\\.* }
    - name: Orders
      collectors:
        - { type: classLike, value: ^App\\Modules\\Orders\\.* }
  ruleset:
    Users: []
    Accounts: [Users]
    Auth: [Accounts, Users]
    Balances: [Accounts]
    Orders: [Balances, Accounts]